<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo base - Interface Homem-Maquina</title>

  <!-- =========================================================
       COMO USAR ESTE ARQUIVO (leia com calma)

       1. Salve este arquivo com o nome: index.html
       2. Para VER a tela: clique duas vezes no arquivo. Ele abre no navegador.
       3. Para EDITAR: abra com o Bloco de Notas, VS Code ou outro editor de texto.
       4. Voce so precisa mexer em duas partes:
            (A) a area de CORES, logo abaixo (dentro de <style>)
            (B) os TEXTOS e CAMPOS, mais para baixo (dentro de <body>)
          Cada parte que voce PODE mudar esta marcada com a expressao "MUDE AQUI".
       5. Salve o arquivo e atualize a pagina no navegador (tecla F5) para ver o resultado.

       Este modelo ja aplica varios principios da Aula 4. Procure no codigo os
       comentarios que comecam com PRINCIPIO: eles explicam qual diretriz esta
       sendo atendida. Voce deve manter esses principios na sua propria tela.
       ========================================================= -->

  <style>
    /* ---------- AREA DE CORES E ESTILO (A) - pode mudar a vontade ---------- */
    :root {
      --cor-principal: #1f6feb;   /* MUDE AQUI: cor dos botoes e destaques */
      --cor-fundo:     #f4f6fa;   /* MUDE AQUI: cor de fundo da tela */
      --cor-cartao:    #ffffff;   /* MUDE AQUI: cor do cartao central */
      --cor-texto:     #1b1f24;   /* MUDE AQUI: cor do texto */
      --cor-erro:      #b42318;   /* cor das mensagens de erro */
      --cor-sucesso:   #1a7f37;   /* cor das mensagens de sucesso */
    }

    /* Daqui para baixo, mexa apenas se quiser. Nao e obrigatorio. */
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif; /* fonte legivel - PRINCIPIO: legibilidade */
      background: var(--cor-fundo);
      color: var(--cor-texto);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .cartao {
      background: var(--cor-cartao);
      width: 100%;
      max-width: 380px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitulo { margin: 0 0 20px; color: #57606a; font-size: 14px; }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
      font-size: 14px;
    }
    /* PRINCIPIO (Aula 4): rotulos claros no idioma do usuario, campos visiveis */
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus {
      outline: 2px solid var(--cor-principal); /* PRINCIPIO: visibilidade e reconhecimento */
      border-color: var(--cor-principal);
    }
    .dica { font-size: 12px; color: #57606a; margin-top: 4px; }

    .botoes { display: flex; gap: 10px; margin-top: 22px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .principal { background: var(--cor-principal); color: #fff; }
    /* PRINCIPIO (Aula 4): saida de emergencia - botao cancelar sempre visivel */
    .secundario { background: #eef1f5; color: var(--cor-texto); }

    .mensagem { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .mensagem.erro { color: var(--cor-erro); }
    .mensagem.sucesso { color: var(--cor-sucesso); }
  </style>
</head>

<body>
  <!-- ================= AREA DE CONTEUDO (B) ================= -->
  <!-- Troque os textos entre as marcas MUDE AQUI pelo conteudo da SUA tela. -->
  <main class="cartao">

    <h1><!-- MUDE AQUI -->Criar conta</h1>
    <p class="subtitulo"><!-- MUDE AQUI -->Preencha os dados para se cadastrar</p>

    <form id="formulario">

      <!-- Cada campo tem: um rotulo, um campo e uma dica. Copie o bloco para criar mais campos. -->
      <label for="nome"><!-- MUDE AQUI -->Nome completo</label>
      <input type="text" id="nome" placeholder="Ex: Maria Silva" required>

      <label for="email"><!-- MUDE AQUI -->E-mail</label>
      <input type="email" id="email" placeholder="voce@exemplo.com" required>
      <p class="dica"><!-- MUDE AQUI -->Usaremos apenas para enviar a confirmacao.</p>

      <label for="senha"><!-- MUDE AQUI -->Senha</label>
      <input type="password" id="senha" placeholder="Minimo de 6 caracteres" minlength="6" required>

      <div class="botoes">
        <!-- PRINCIPIO (Aula 4): controle do usuario - acao principal e opcao de desfazer -->
        <button type="submit" class="principal"><!-- MUDE AQUI -->Cadastrar</button>
        <button type="reset" class="secundario"><!-- MUDE AQUI -->Limpar</button>
      </div>

      <!-- PRINCIPIO (Aula 4): projeto para erros - espaco reservado para feedback -->
      <p id="mensagem" class="mensagem"></p>
    </form>
  </main>

  <!-- ================= FEEDBACK SIMPLES (nao precisa mexer) =================
       Este trecho apenas mostra uma mensagem de sucesso ou erro ao enviar,
       para demonstrar o PRINCIPIO de "projeto para erros" e feedback ao usuario.
       Duplas do caminho VISUAL podem ignorar; duplas do caminho CODIGO podem
       melhorar as validacoes. -->
  <script>
    const form = document.getElementById('formulario');
    const msg = document.getElementById('mensagem');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.className = 'mensagem sucesso';
      msg.textContent = 'Cadastro enviado com sucesso. (mensagem de exemplo)';
    });
    form.addEventListener('reset', function () {
      msg.className = 'mensagem';
      msg.textContent = '';
    });
  </script>
</body>
</html>
